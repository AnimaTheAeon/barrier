name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install "flask==3.*"
          python3 tests/run_tests.py
      - name: Build .spk and app download
        id: spk
        run: |
          SPK=$(sh synology/build-spk.sh dist | tail -n1)
          echo "file=$SPK" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: barrier-synology
          path: dist/*
      - name: Release notes from CHANGES.md
        run: |
          awk -v v="## ${{ steps.spk.outputs.version }}" '$0==v{on=1;next} /^## /{on=0} on' CHANGES.md > notes.md
          printf '\n**Install:** Package Center → Manual Install → the .spk below. Already installed? Barrier updates itself (Updates card).\n' >> notes.md
          cat notes.md
      # Pushing a new VERSION to main publishes v<version>. Same version: no new release.
      - name: Check for existing release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft left by a publish that failed half-way doesn't count: remove it
          # (and its tag) so this run publishes the release properly.
          tag="v${{ steps.spk.outputs.version }}"
          found=$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"" | head -n1)
          if [ -z "$found" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "${found#* }" = "true" ]; then
            echo "Removing the unfinished draft of $tag"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${found%% *}"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.spk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Barrier v${{ steps.spk.outputs.version }}
          body_path: notes.md
          files: |
            ${{ steps.spk.outputs.file }}
            dist/barrier-app-${{ steps.spk.outputs.version }}.tar.gz
          make_latest: true
